<title>ZD美股选股工作台 · 双池</title>
<style>
:root{--bg:#16171a;--panel:#1e2024;--panel2:#25272c;--line:rgba(255,255,255,.08);--txt:#e8e9eb;--mut:#9a9da3;--dim:#6b6e75;--blue:#85B7EB;--teal:#5DCAA5;--amber:#EF9F27;--red:#E24B4A;--green:#97C459;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.6;padding:20px 24px 40px}
.wrap{max-width:1120px;margin:0 auto}
h1{font-size:20px;font-weight:500;letter-spacing:.5px}
h2{font-size:15px;font-weight:500;margin-bottom:12px}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;border:.5px solid var(--line);background:var(--panel);font-size:12px;color:var(--mut);margin-left:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0 18px}
.stat{background:var(--panel);border:.5px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{font-size:19px;font-weight:500;display:block}
.tabs{display:flex;gap:6px;border-bottom:.5px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--mut);border:.5px solid transparent;border-bottom:none;font-size:13px}
.tab.on{color:var(--txt);background:var(--panel);border-color:var(--line)}
.tab:hover{color:var(--txt)}
.pane{display:none}.pane.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:.5px solid var(--line);border-radius:12px;padding:16px}
.card.top{border:1.5px solid rgba(239,159,39,.55)}
.card.midtop{border:1.5px solid rgba(93,202,165,.55)}
.rank{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:#EF9F27;color:#1c1306;font-weight:500;font-size:14px;margin-right:8px}
.rank.mid{background:#5DCAA5;color:#04342C}
.stk{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.stk .nm{font-size:16px;font-weight:500}
.stk .cd{color:var(--mut);font-size:12px;margin-left:6px}
.score{font-size:30px;font-weight:500;color:var(--amber);flex:none}
.score.mid{color:var(--teal)}
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.bar-row .lb{width:56px;color:var(--mut);flex:none}
.bar{flex:1;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.reason{margin-top:10px;padding:8px 10px;background:var(--panel2);border-radius:8px;color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 8px;text-align:center;border-bottom:.5px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;position:sticky;top:0;background:var(--bg)}
tr.elim td{color:var(--dim)}
tr.top3 td{background:rgba(239,159,39,.07)}
tr.midtop3 td{background:rgba(93,202,165,.08)}
tr.det td{background:var(--panel2);white-space:normal;text-align:left;font-size:12px;color:var(--mut)}
.sc{display:inline-block;min-width:64px;padding:2px 6px;border-radius:6px;font-size:11.5px;text-align:center}
.ok{background:rgba(151,196,89,.15);color:var(--green)}
.no{background:rgba(226,75,74,.14);color:var(--red)}
.pooltag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px}
.pool-l{background:rgba(133,183,235,.15);color:var(--blue)}
.pool-m{background:rgba(93,202,165,.15);color:var(--teal)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.metric{display:flex;justify-content:space-between;padding:6px 0;border-bottom:.5px solid var(--line);font-size:12.5px}
.metric span:first-child{color:var(--mut)}
.scen{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.scen div{border-radius:8px;padding:8px 10px;font-size:12px}
.scen .up{background:rgba(151,196,89,.12);border:.5px solid rgba(151,196,89,.3)}
.scen .mid{background:rgba(133,183,235,.12);border:.5px solid rgba(133,183,235,.3)}
.scen .dn{background:rgba(226,75,74,.12);border:.5px solid rgba(226,75,74,.3)}
.scen b{font-size:13px}
details{background:var(--panel);border:.5px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
summary{cursor:pointer;font-weight:500;font-size:13px}
details p{color:var(--mut);font-size:12.5px;margin-top:8px}
.search{width:220px;background:var(--panel);border:.5px solid var(--line);border-radius:8px;color:var(--txt);padding:7px 12px;font-size:13px;margin-bottom:10px;outline:none}
.search:focus{border-color:rgba(133,183,235,.5)}
.chips{display:inline-flex;gap:6px;margin-left:10px}
.chips span{padding:4px 12px;border-radius:999px;border:.5px solid var(--line);cursor:pointer;font-size:12px;color:var(--mut)}
.chips span.on{color:var(--txt);background:var(--panel2)}
.foot{margin-top:26px;color:var(--dim);font-size:11.5px;line-height:1.8}
.chartbox{position:relative;height:210px;margin-top:6px}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.dual>div{display:flex;flex-direction:column;min-width:0}
.dual h3{font-size:13px;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex:none}
.dual .cards{flex:1;display:grid;grid-template-columns:1fr;grid-auto-rows:1fr;gap:14px}
.dual .card{height:100%;display:flex;flex-direction:column}
.dual .card .grid2{flex:1}
.dual .card .reason{margin-top:auto}
@media(max-width:760px){.cards{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.dual{grid-template-columns:1fr}}
</style>
</head>
